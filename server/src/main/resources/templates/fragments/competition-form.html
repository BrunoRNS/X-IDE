<div th:fragment="competitionForm">

    <form id="competitionForm" action="/competition/start" method="POST" class="mt-6 space-y-4">

        <div>
            <label for="startDate" class="mb-2 block text-sm font-medium">
                Start date
            </label>

            <input type="datetime-local" id="startDate" name="startDate" required
                class="w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm outline-none dark:border-zinc-800 dark:bg-zinc-900 dark:text-white">
        </div>

        <div>
            <label for="endDate" class="mb-2 block text-sm font-medium">
                End date
            </label>

            <input type="datetime-local" id="endDate" name="endDate" required
                class="w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm outline-none dark:border-zinc-800 dark:bg-zinc-900 dark:text-white">
        </div>
         <div class="flex flex-col gap-2 sm:flex-row">

                <div class="relative min-w-0 flex-1">

                    <i class="fa-solid fa-chevron-down pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-xs text-zinc-400"></i>

                    <select id="options"
                            class="w-full appearance-none rounded-xl border border-zinc-200 bg-zinc-50 px-4 py-3 pr-10 text-sm text-zinc-700 outline-none transition focus:border-red-500 focus:bg-white focus:ring-2 focus:ring-red-500/10 dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-300 dark:focus:bg-zinc-950">

                        <option value="" selected disabled>
                            Select an problens...
                        </option>

                    </select>
                </div>

                <button id="refreshBtn"
                    type="button"
                    onclick="addItem()"
                    class="inline-flex shrink-0 items-center justify-center gap-2
                        rounded-xl bg-zinc-900 px-5 py-3
                        text-sm font-semibold text-white
                        transition-all duration-200
                        hover:bg-red-600
                        focus:outline-none focus:ring-2 focus:ring-red-500/30
                        dark:bg-zinc-800 dark:text-zinc-100
                        dark:hover:bg-red-600 dark:hover:text-white">

                <i class="fa-solid fa-plus"></i>
                Add problem
            </button>

            </div>

            <div class="overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800">

                <div class="flex items-center justify-between border-b border-zinc-200 bg-zinc-50 px-4 py-3 dark:border-zinc-800 dark:bg-zinc-900/70">

                    <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">
                        Selected problem
                    </span>

                    <span id="selectionCount"
                          class="rounded-full bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-700 dark:bg-red-950 dark:text-red-400">
                        0 items
                    </span>

                </div>

                <ul id="list-selections"
                    class="min-h-16 divide-y divide-zinc-100 dark:divide-zinc-800">

                    <li id="emptySelection"
                        class="flex flex-col items-center justify-center gap-2 px-4 py-6 text-center">

                        <i class="fa-solid fa-inbox text-xl text-zinc-300 dark:text-zinc-700"></i>

                        <span class="text-xs text-zinc-400">
                            No problems selected yet
                        </span>

                    </li>

                </ul>

            </div>

        <div class="flex gap-3 pt-3">

            <button type="button" onclick="closeStudentModal()"
                class="flex-1 rounded-lg border border-zinc-200 px-4 py-3 text-sm font-medium">
                Cancel
            </button>

            <button type="submit"
                class="flex-1 rounded-lg bg-green-600 px-4 py-3 text-sm font-semibold text-white hover:bg-green-700">
                <i class="fa-solid fa-play mr-1"></i>
                Start
            </button>

        </div>
    </form>

</div>
