<nav th:fragment="menu"
     th:with="path=${requestPath}"
     data-aos="fade-down"
     class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2
            border-b border-zinc-200 dark:border-zinc-800
            px-4 py-3 sm:px-7">

    <a href="/" class="order-1 flex items-center shrink-0">
        <img src="/public/logo.png"
             alt="X-IDE"
             class="h-7 w-auto sm:h-8">
    </a>

    <div id="main-menu" class="order-4 hidden w-full items-center justify-start gap-1 overflow-x-auto
                border-t border-zinc-100 pt-2
                sm:order-2 sm:flex sm:w-auto sm:justify-center sm:gap-2 sm:overflow-visible
                sm:border-0 sm:pt-0 dark:border-zinc-900 sm:dark:border-0">

        <a href="/"
           class="px-3 py-2 text-sm font-medium
                  border-b-2 transition-all duration-200"
           th:classappend="${#strings.equals(path, '/')
               ? 'text-red-600 border-red-600'
               : 'text-zinc-500 border-transparent hover:text-red-600 hover:border-red-600'}">
            Home
        </a>

        <a href="/classroom"
           class="px-3 py-2 text-sm font-medium
                  border-b-2 transition-all duration-200"
           th:classappend="${#strings.startsWith(path, '/class')
               ? 'text-red-600 border-red-600'
               : 'text-zinc-500 border-transparent hover:text-red-600 hover:border-red-600'}">
            Class
        </a>

        <a href="/competition"
           class="px-3 py-2 text-sm font-medium
                  border-b-2 transition-all duration-200"
           th:classappend="${#strings.startsWith(path, '/competition')
               ? 'text-red-600 border-red-600'
               : 'text-zinc-500 border-transparent hover:text-red-600 hover:border-red-600'}">
            Competition
        </a>

        <a href="/students"
           class="px-3 py-2 text-sm font-medium
                  border-b-2 transition-all duration-200"
           th:classappend="${#strings.startsWith(path, '/students')
               ? 'text-red-600 border-red-600'
               : 'text-zinc-500 border-transparent hover:text-red-600 hover:border-red-600'}">
            Students
        </a>

    </div>


    <button id="theme-toggle"
            type="button"
            title="Alternar tema"
            aria-label="Alternar tema claro/escuro"
            class="order-2 flex h-9 w-9 shrink-0 items-center
                   justify-center rounded-lg
                   border border-zinc-200 dark:border-zinc-800
                   text-zinc-600 dark:text-zinc-300
                   hover:bg-zinc-100 dark:hover:bg-zinc-800
                   transition-all duration-200 sm:order-3">

        <span id="theme-icon">🌙</span>
    </button>

    <button id="menu-toggle" type="button" aria-controls="main-menu" aria-expanded="false"
            aria-label="Abrir menu"
            class="order-3 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg
                   border border-zinc-200 text-zinc-600 transition-all duration-200
                   hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-300
                   dark:hover:bg-zinc-800 sm:hidden">
        <i id="menu-toggle-icon" class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <script>
        (function () {
            const btn = document.getElementById('theme-toggle');
            const icon = document.getElementById('theme-icon');

            if (!btn || !icon) return;

            const update = () => {
                icon.textContent =
                    document.documentElement.classList.contains('dark')
                        ? '☀️'
                        : '🌙';
            };

            btn.addEventListener('click', () => {
                const isDark =
                    document.documentElement.classList.toggle('dark');

                localStorage.setItem(
                    'theme',
                    isDark ? 'dark' : 'light'
                );

                update();
            });

            update();
        })();
    </script>

    <script>
        (function () {
            const btn = document.getElementById('menu-toggle');
            const menu = document.getElementById('main-menu');
            const icon = document.getElementById('menu-toggle-icon');

            if (!btn || !menu || !icon) return;

            const setOpen = (isOpen) => {
                btn.setAttribute('aria-expanded', String(isOpen));
                btn.setAttribute('aria-label', isOpen ? 'Fechar menu' : 'Abrir menu');
                menu.classList.toggle('hidden', !isOpen);
                menu.classList.toggle('flex', isOpen);
                icon.classList.toggle('fa-bars', !isOpen);
                icon.classList.toggle('fa-xmark', isOpen);
            };

            btn.addEventListener('click', () => {
                const isOpen = btn.getAttribute('aria-expanded') !== 'true';
                setOpen(isOpen);
            });

            menu.querySelectorAll('a').forEach((link) => {
                link.addEventListener('click', () => setOpen(false));
            });

            window.matchMedia('(min-width: 640px)').addEventListener('change', () => setOpen(false));
        })();
    </script>

</nav>
