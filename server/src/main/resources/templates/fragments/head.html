<th:block th:fragment="commonHead(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">X-IDE</title>

    <script src="/public/vendor/tailwind.browser.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="/public/vendor/aos.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));

        .brand {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -5px;
        }

        .typing {
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #dc2626;
            width: 0;
            animation: typing 3s steps(32) 0.5s forwards,
                       blink .8s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 32ch; }
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        .fade-up {
            animation: fadeUp .8s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action-button {
            transition: all .2s ease;
        }

        .action-button:hover {
            transform: translateY(-2px);
        }
    </style>

    <script>
        if (
            localStorage.theme === 'dark' ||
            (!('theme' in localStorage) &&
                window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</th:block>
