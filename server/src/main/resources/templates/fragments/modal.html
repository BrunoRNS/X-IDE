<div th:fragment="modal(title, description)"
     id="studentModal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div id="studentModalContent"
         class="w-full max-w-md scale-95 rounded-2xl border border-zinc-200 bg-white p-6 opacity-0 shadow-2xl transition-all duration-300 dark:border-zinc-800 dark:bg-zinc-950">
        <div class="flex items-center justify-between">
            <div>
                <h2 id="modalTitle" class="text-xl font-bold" th:text="${title}">Title</h2>
                <p id="modalDescription" class="mt-1 text-sm text-zinc-500 dark:text-zinc-400"
                   th:text="${description}">Description</p>
            </div>
            <button type="button" onclick="closeStudentModal()"
                    class="flex h-9 w-9 items-center justify-center rounded-lg text-zinc-500 hover:bg-zinc-100 hover:text-red-600 dark:hover:bg-zinc-900"
                    aria-label="Close dialog">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <form action="/students/register" method="POST" class="mt-6 space-y-4" id="registerStudentForm">
            <input type="hidden" id="studentId" name="id">

            <div>
                <label for="studentName" class="mb-2 block text-sm font-medium">Student Name</label>
                <input type="text" id="studentName" name="name" placeholder="Enter student name" required
                       class="w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-red-600 dark:border-zinc-800 dark:bg-zinc-900 dark:text-white">
            </div>

            <div>
                <label for="studentEmail" class="mb-2 block text-sm font-medium">Email Address</label>
                <input type="email" id="studentEmail" name="email" placeholder="student@example.com" required
                       class="w-full rounded-lg border border-zinc-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-red-600 dark:border-zinc-800 dark:bg-zinc-900 dark:text-white">
            </div>

            <div class="flex gap-3 pt-3">
                <button type="button" onclick="closeStudentModal()"
                        class="flex-1 rounded-lg border border-zinc-200 px-4 py-3 text-sm font-medium hover:bg-zinc-100 dark:border-zinc-800 dark:hover:bg-zinc-900">
                    Cancel
                </button>
                <button type="submit"
                        class="action-button flex-1 rounded-lg bg-red-600 px-4 py-3 text-sm font-semibold text-white hover:bg-red-700">
                    <i id="submitIcon" class="fa-solid fa-plus mr-1"></i>
                    <span id="submitText">Register</span>
                </button>
            </div>
        </form>
    </div>
</div>
