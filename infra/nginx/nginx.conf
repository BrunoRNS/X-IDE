# X-IDE edge proxy.
#
# Nginx terminates TLS 1.3 for the public endpoints and reverse-proxies:
#   - /ws/      -> WebSocket server (server.jar, port 8082 inside the container)
#   - /         -> frontend (port 8081 on the host via host.docker.internal)
#   - /healthz  -> built-in Nginx health probe
#
# Port 8080 stays plain HTTP and only serves /healthz; every other request is
# redirected to the HTTPS listener on 8443. TLS 1.2 and older are rejected.
# Replace the development certificates in infra/nginx/certs/ with a trusted
# certificate for real deployments.

# --- WebSocket HTTP -> ws connection upgrade ---------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Upstreams ---------------------------------------------------------------
upstream xide_websocket {
    server 127.0.0.1:8082;
}

upstream xide_frontend {
    server host.docker.internal:8081;
}

# --- Shared TLS 1.3 settings --------------------------------------------------
# TLS 1.3 only; ssl_ciphers does not apply to 1.3, suites are set via
# ssl_conf_command (nginx 1.19.4+, OpenSSL 1.1.1+).
ssl_protocols TLSv1.3;
ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
ssl_session_cache shared:xide_tls:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    # Plain HTTP listener: health probe + redirect to the TLS 1.3 edge.
    listen 8080 default_server;
    server_name _;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    # Public TLS 1.3 edge.
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Enable for production with a trusted certificate:
    # add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /ws/ {
        proxy_pass http://xide_websocket;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://xide_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
