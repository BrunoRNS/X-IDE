# HTTP site only: Javalin + Nginx without the WebSocket server.
services:
  server-site:
    image: xide-server-site:local
    restart: unless-stopped
    environment:
      XIDE_SERVER_ROLE: site
      SERVER_PORT: "8081"
      TLS_HOST: ${TLS_HOST:-localhost}
      TLS_HOST_AUTO: ${TLS_HOST_AUTO:-}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      # Plain HTTP ports used by the Class page to host folders for students.
      - "${BIND_ADDRESS:-127.0.0.1}:${CLASSROOM_PORT_RANGE:-8083-8102}:${CLASSROOM_PORT_RANGE:-8083-8102}"
    volumes:
      - tls_certs:/etc/nginx/certs
      - uploads_data:/opt/xide/uploads

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
  tls_certs:
  uploads_data:
