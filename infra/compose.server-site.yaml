# Standalone HTTP site: Javalin + Nginx without the WebSocket server.
# The database lives in its own compose file (infra/compose.server-database.yaml).
# Start with: docker compose -f infra/compose.server-site.yaml up
name: xide-server-site

services:
  server-site:
    image: xide-server:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      XIDE_SERVER_ROLE: site
      SERVER_PORT: "8081"
      TLS_HOST: ${TLS_HOST:-localhost}
      TLS_HOST_AUTO: ${TLS_HOST_AUTO:-}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      DB_HOST: ${DB_HOST:?Set DB_HOST in the root .env file}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME in the root .env file}
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      # Plain HTTP ports used by the Class page to host folders for students.
      - "${BIND_ADDRESS:-127.0.0.1}:${CLASSROOM_PORT_RANGE:-8083-8102}:${CLASSROOM_PORT_RANGE:-8083-8102}"
    volumes:
      - tls_certs:/etc/nginx/certs
      - uploads_data:/opt/xide/uploads

volumes:
  tls_certs:
  uploads_data:
