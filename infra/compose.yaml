services:
  app:
    image: xide-server:local
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      TLS_HOST: ${TLS_HOST:-localhost}
      TLS_HOST_AUTO: ${TLS_HOST_AUTO:-}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in the root .env file}
      DB_USER: ${DB_USER:?Set DB_USER in the root .env file}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"
      # Plain HTTP ports used by the Class page to host folders for students.
      - "${BIND_ADDRESS:-127.0.0.1}:${CLASSROOM_PORT_RANGE:-8083-8102}:${CLASSROOM_PORT_RANGE:-8083-8102}"
    volumes:
      - tls_certs:/etc/nginx/certs

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in the root .env file}
      MYSQL_USER: ${DB_USER:?Set DB_USER in the root .env file}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the root .env file}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
  ollama_data:
  tls_certs:
