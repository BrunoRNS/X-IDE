name: Package Server Bundles

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to package (e.g., 1.0.0 or 0.0.0-dev)'
        required: true
        type: string
      platforms:
        description: 'Docker platforms to build for (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      GH_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xide-server

jobs:
  build-server:
    name: Build server JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build server
        run: ./mvnw -B -ntp -pl server -am package -DskipTests
      - name: Set version output
        id: set-version
        run: echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: xide-server-${{ inputs.version }}
          path: server/target/*.jar
          retention-days: 7

  docker:
    name: Build & push Docker image
    needs: [build-server]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max