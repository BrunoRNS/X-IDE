name: Server Bundle Packaging

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to package (e.g., 1.0.0 or 0.0.0-dev)'
        required: true
        type: string
      platforms:
        description: 'Docker platforms to build for (comma-separated)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

permissions:
  contents: read

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xide-server

jobs:
  build-server-jar:
    name: Build · Server JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Package server JAR
        run: ./mvnw -B -ntp -pl server -am -DskipTests package

      - name: Upload server JAR
        uses: actions/upload-artifact@v7
        with:
          name: xide-server-${{ inputs.version }}
          path: server/target/server.jar
          retention-days: 7

  build-server-bundles:
    name: Build · Server ZIP bundles
    needs:
      - build-server-jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download server JAR
        uses: actions/download-artifact@v8
        with:
          name: xide-server-${{ inputs.version }}
          path: server/target

      # QEMU is only needed when an architecture other than the runner's is
      # requested; the JAR itself is architecture-independent Java bytecode.
      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server bundles (full, site, ai, database)
        run: >-
          python3 scripts/package-server.py --variant all
          --version '${{ inputs.version }}'
          --platforms '${{ inputs.platforms }}'
          --output-dir dist

      - name: List bundles
        run: find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload server bundles
        uses: actions/upload-artifact@v7
        with:
          name: xide-server-bundles-${{ inputs.version }}
          path: dist/*.zip
          retention-days: 7

  publish-server-image:
    name: Publish · Java server image to GHCR
    needs:
      - build-server-jar
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download server JAR
        uses: actions/download-artifact@v8
        with:
          name: xide-server-${{ inputs.version }}
          path: server/target

      - name: Set up Docker QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha

      - name: Build and publish Java image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
