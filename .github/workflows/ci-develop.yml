name: CI (develop)


on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.module }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [common, client, server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run ${{ matrix.module }} tests
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am test
