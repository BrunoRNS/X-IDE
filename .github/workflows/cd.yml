name: CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  test:
    name: test · ${{ matrix.module }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [common, client, server]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Run ${{ matrix.module }} tests
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am test

  # ==========================================
  # CLIENT BUNDLES
  # ==========================================

  build-client:
    name: build · client native bundles
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    uses: ./.github/workflows/package-client.yml
    with:
      version: ${{ github.ref_name }}

  # ==========================================
  # SERVER BUNDLES (GraalVM native images)
  # ==========================================

  build-server:
    name: build · server ZIP bundles
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/package-server.yml
    with:
      version: ${{ github.ref_name }}
      platforms: linux/amd64,linux/arm64

  # ==========================================
  # DOCKER HUB
  # ==========================================

  docker:
    name: docker · publish native multi-arch image to Docker Hub
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub secrets
        run: |
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/xide
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop-${{ github.run_number }}-${{ github.run_attempt }},enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # GITHUB RELEASE
  # ==========================================

  release:
    name: release · client + server bundles
    needs:
      - test
      - build-client
      - build-server

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Download all 8 client bundles.
      - name: Download client bundles
        uses: actions/download-artifact@v8
        with:
          pattern: xide-client-*-${{ github.ref_name }}
          path: dist
          merge-multiple: true

      # The fat client JAR is published as a standalone asset. The server is
      # never published as a JAR: it ships only inside the Docker ZIP bundles.
      - name: Download fat client JAR
        uses: actions/download-artifact@v8
        with:
          name: xide-client-${{ github.ref_name }}
          path: client-jar

      - name: Rename fat client JAR
        run: |
          cp client-jar/client-all.jar "dist/xide-client-all-${{ github.ref_name }}.jar"

      # Download the 4 server ZIP bundles (full, site, ai, database).
      - name: Download server bundles
        uses: actions/download-artifact@v8
        with:
          name: xide-server-bundles-${{ github.ref_name }}
          path: dist

      # Ensure everything exists before publishing.
      - name: Verify release artifacts
        shell: bash
        run: |
          echo "=================================="
          echo "RELEASE ARTIFACTS"
          echo "=================================="

          find dist -maxdepth 1 -type f -printf '%f\n' | sort

          CLIENT_ZIPS=$(find dist -maxdepth 1 -type f -name 'xide-client-*.zip' | wc -l)
          CLIENT_JARS=$(find dist -maxdepth 1 -type f -name 'xide-client-all-*.jar' | wc -l)
          SERVER_ZIPS=$(find dist -maxdepth 1 -type f -name 'xide-server-*.zip' | wc -l)

          echo ""
          echo "Client bundles: $CLIENT_ZIPS / 8"
          echo "Fat client JARs: $CLIENT_JARS / 1"
          echo "Server bundles: $SERVER_ZIPS / 4"

          if [ "$CLIENT_ZIPS" -ne 8 ]; then
            echo "::error::Expected 8 client bundles, found $CLIENT_ZIPS."
            exit 1
          fi

          if [ "$CLIENT_JARS" -ne 1 ]; then
            echo "::error::Expected the fat client JAR, found $CLIENT_JARS."
            exit 1
          fi

          for variant in full site ai database; do
            if [ ! -f "dist/xide-server-${variant}-${{ github.ref_name }}.zip" ]; then
              echo "::error::Missing xide-server-${variant}-${{ github.ref_name }}.zip"
              exit 1
            fi
          done

          if [ "$SERVER_ZIPS" -ne 4 ]; then
            echo "::error::Expected 4 server bundles, found $SERVER_ZIPS."
            exit 1
          fi

          echo ""
          echo "All release artifacts verified!"

      # Publish or update existing GitHub Release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
