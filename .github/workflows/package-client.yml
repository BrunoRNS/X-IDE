name: Client Bundle Packaging

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to package (e.g., 1.0.0 or 0.0.0-dev)'
        required: true
        type: string

permissions:
  contents: read

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  build-client-jar:
    name: Build · Client JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Package client JAR
        run: ./mvnw -B -ntp -pl client -am -DskipTests package

      - name: Upload client JAR
        uses: actions/upload-artifact@v7
        with:
          name: xide-client-${{ inputs.version }}
          path: client/target/*.jar
          retention-days: 7

  package-client-linux-x64:
    name: Package · Linux x64
    needs: build-client-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          architecture: x64
          cache: maven

      - name: Download client JAR
        uses: actions/download-artifact@v7
        with:
          name: xide-client-${{ inputs.version }}
          path: client/target

      - name: Create Linux x64 application bundle
        run: |
          mkdir -p dist

          jpackage --type app-image --name XIDE-Client \
            --input client/target \
            --main-jar client-1.0-SNAPSHOT-all.jar \
            --main-class org.xide.Main \
            --dest dist

          cd dist
          zip -r ../xide-client-linux-x64-${{ inputs.version }}.zip XIDE-Client

      - name: Upload Linux x64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: xide-client-linux-x64-${{ inputs.version }}
          path: xide-client-linux-x64-${{ inputs.version }}.zip
          retention-days: 7

  package-client-linux-x86:
