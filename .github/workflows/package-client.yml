name: Package Client Bundles

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to package (e.g., 1.0.0 or 0.0.0-dev)'
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  build-client:
    name: Build client JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build client shaded JAR
        run: ./mvnw -B -ntp -pl client -am -DskipTests package
      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: xide-client-${{ inputs.version }}
          path: client/target/*.jar
          retention-days: 7

  package-linux-x64:
    name: package · client · linux-x64
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
      - name: Download client JAR
        uses: actions/download-artifact@v4
        with:
          name: xide-client-${{ inputs.version }}
          path: client/target
      - name: Create native application bundle (linux-x64)
        run: |
          mkdir -p dist
          jpackage --type app-image --name XIDE-Client \
            --input client/target \
            --main-jar client-1.0-SNAPSHOT-all.jar \
            --main-class org.xide.Main \
            --dest dist
          cd dist && zip -r ../xide-client-linux-x64-${{ inputs.version }}.zip XIDE-Client
      - name: Upload linux-x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: xide-client-linux-x64-${{ inputs.version }}
          path: xide-client-linux-x64-${{ inputs.version }}.zip
          retention-days: 7

  package-linux-x86:
