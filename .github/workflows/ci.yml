name: Development Validation

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches-ignore:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: development-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  code-quality:
    name: Code quality · Spring Java Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Validate code formatting
        run: ./mvnw -B -ntp validate

  unit-tests:
    name: Unit tests · ${{ matrix.module }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        module:
          - common
          - client
          - server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Run module tests
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am test

  build-client:
    name: Build · Client bundles
    needs:
      - code-quality
      - unit-tests
    uses: ./.github/workflows/package-client.yml
    with:
      version: 0.0.0-ci

  build-server:
    name: Build · Server bundles
    needs:
      - code-quality
      - unit-tests
    uses: ./.github/workflows/package-server.yml
    with:
      version: 0.0.0-ci
      platforms: linux/amd64
