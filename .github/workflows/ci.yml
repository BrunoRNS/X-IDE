name: CI


on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Maven Central rate-limits GitHub's shared runner IPs (HTTP 429).
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"

jobs:
  lint:
    name: lint · spring-javaformat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check formatting (Spring Java Format)
        run: ./mvnw -B -ntp validate

  build-client-native:
    name: client bundle · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build standalone client
        run: ./mvnw -B -ntp -pl client -am -DskipTests package
      - name: Create native application bundle
        run: |
          mkdir -p dist
          jpackage --type app-image --name XIDE-Client \
            --input client/target \
            --main-jar client-1.0-SNAPSHOT-all.jar \
            --main-class org.xide.Main \
            --dest dist
          app_image=XIDE-Client
          if [[ "${{ matrix.target }}" == macos-* ]]; then
            app_image=XIDE-Client.app
          fi
          python - "$app_image" "dist/xide-client-${{ matrix.target }}.zip" <<'PY'
          import os
          import sys
          import zipfile

          root, archive = sys.argv[1:]
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
              for current, _, files in os.walk(os.path.join("dist", root)):
                  for filename in files:
                      path = os.path.join(current, filename)
                      bundle.write(path, os.path.relpath(path, "dist"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xide-client-${{ matrix.target }}
          path: dist/xide-client-${{ matrix.target }}.zip
          if-no-files-found: error

  build-server-container:
    name: server image · Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build server image used by make run-server
        run: make build-server-image
      - name: Package server image as ZIP
        run: |
          mkdir -p dist
          docker save xide-server:local --output dist/xide-server-image.tar
          python3 - <<'PY'
          import zipfile

          with open("dist/README.txt", "w", encoding="utf-8") as readme:
              readme.write(
                  "X-IDE server Docker image\n\n"
                  "Load the image with: docker load -i xide-server-image.tar\n"
                  "From the X-IDE repository, start the stack with: make run-server RUN_SERVER_BUILD=0\n"
                  "This starts the server, MySQL, and Nginx through Docker Compose.\n"
              )
          with zipfile.ZipFile("dist/xide-server-docker.zip", "w", zipfile.ZIP_DEFLATED) as bundle:
              bundle.write("dist/xide-server-image.tar", "xide-server-image.tar")
              bundle.write("dist/README.txt", "README.txt")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xide-server-docker
          path: dist/xide-server-docker.zip
          if-no-files-found: error

  test-native:
    name: test · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
            dist: temurin
          - os: ubuntu-24.04-arm
            label: linux-arm64
            dist: temurin
          - os: macos-15-intel
            label: mac-x64
            dist: temurin
          - os: macos-latest
            label: mac-arm64
            dist: temurin
          - os: windows-latest
            label: windows-x64
            dist: temurin
          - os: windows-11-arm
            label: windows-arm64
            dist: microsoft
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.dist }}
          java-version: '17'
          cache: maven
      - name: Run all module tests (common, client, server)
        run: ./mvnw -B -ntp test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.label }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  # 32-bit Linux without QEMU:
  #   linux/386  -> native IA32 execution on the x86_64 runner kernel
  # The default Docker bridge network is used so the container gets Docker's
  # embedded DNS resolver instead of the runner's host resolv.conf.
  test-linux-32bit:
    name: test · ${{ matrix.label }} (native, no QEMU)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86
            platform: linux/386
            arch: i386
    steps:
      - uses: actions/checkout@v5
      - name: Verify that no QEMU binfmt handler is registered
        run: |
          echo "binfmt handlers:"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null || true
          case "${{ matrix.platform }}" in
            linux/386)    qemu_handler=qemu-i386 ;;
            *)            echo "::error::unsupported platform"; exit 1 ;;
          esac
          if [ -e "/proc/sys/fs/binfmt_misc/$qemu_handler" ]; then
            echo "::error::QEMU handler $qemu_handler is registered; refusing to run emulated tests."
            exit 1
          fi
      - name: Restore Maven repository cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ matrix.label }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ matrix.label }}-
      - name: Run tests inside ${{ matrix.platform }} container
        run: |
          mkdir -p "$HOME/.m2"
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -e EXPECTED_ARCH=${{ matrix.arch }} \
            -e MAVEN_ARGS \
            -v "$PWD":/workspace \
            -v "$HOME/.m2":/root/.m2 \
            -w /workspace \
            debian:bookworm-slim \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ca-certificates curl unzip openjdk-17-jdk-headless
              echo "=== TARGET ARCHITECTURE ==="
              echo "container: $(dpkg --print-architecture)"
              echo "long bit: $(getconf LONG_BIT)"
              test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
              test "$(getconf LONG_BIT)" = "32"
              java -XshowSettings:properties -version 2>&1 \
                | grep -E "os.arch|os.version|java.version"
              java -XshowSettings:properties -version 2>&1 \
                | grep -q "sun.arch.data.model = 32"
              echo "=== MAVEN VERSION ==="
              ./mvnw -version
              echo "=== RUN TESTS ==="
              ./mvnw -B -ntp test
            '
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.label }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  test-windows-x86:
    name: test · windows-x86 (32-bit JVM)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x86
          cache: maven
      - name: Verify 32-bit JVM
        run: |
          java -XshowSettings:properties -version 2>&1 \
            | grep -E "os.arch|sun.arch.data.model|java.version"
          java -XshowSettings:properties -version 2>&1 \
            | grep -q "sun.arch.data.model = 32"
      - name: Run all module tests (common, client, server)
        run: ./mvnw -B -ntp test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-windows-x86
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
