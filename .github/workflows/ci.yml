name: CI

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches-ignore:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_ARGS: "-s .mvn/ci-settings.xml"
  MVNW_REPOURL: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  lint:
    name: lint · spring-javaformat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check formatting (Spring Java Format)
        run: ./mvnw -B -ntp validate

  test:
    name: test · ${{ matrix.module }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        module: [common, client, server]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run ${{ matrix.module }} tests
        run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am test

  package-client:
    name: package · client bundles
    needs: [lint, test]
    uses: ./.github/workflows/package-client.yml
    with:
      version: 0.0.0-ci

  package-server:
    name: package · server bundles
    needs: [lint, test]
    uses: ./.github/workflows/package-server.yml
    with:
      version: 0.0.0-ci
      platforms: linux/amd64