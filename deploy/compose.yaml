services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set in deploy/.env}
      MYSQL_USER: ${DB_USER:?DB_USER must be set in deploy/.env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in deploy/.env}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [backend]
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      XIDE_HOST: 0.0.0.0
      XIDE_PORT: 8081
      XIDE_DEFAULT_USER: ${XIDE_DEFAULT_USER:-default}
      XIDE_DEFAULT_PASSWORD: ${XIDE_DEFAULT_PASSWORD:?run-server must supply XIDE_DEFAULT_PASSWORD}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql: {condition: service_healthy}
    expose: ["8081"]
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [server]
    ports: ["8443:443"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./certs:/etc/nginx/certs:ro"]
    networks: [backend]
volumes:
  mysql_data:
networks:
  backend:
    driver: bridge
